<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap@3.3.7/dist/css/bootstrap.min.css"
      integrity="sha384-BVYiiSIFeK1dGmJRAkycuHAHRg32OmUcww7on3RYdg4Va+PmSTsz/K68vbdEjh4u"
      crossorigin="anonymous"
    />
    <link
      rel="icon"
      href="https://icons.veryicon.com/png/o/business/educational-administration-related/new-student-registration.png"
    />
    <title>Student Registration Form</title>
    <style>
      .container {
        margin-top: 20px;
        padding-bottom: 20px;
        padding-top: 10px;
        box-shadow: 2px 2px 2px 2px black;
        background-color: aliceblue;
        border-radius: 10px;
        font-family: Arial;
      }
      label{
        color: rgb(0, 0, 0);
      }
      .head{
        color:blueviolet;
      }
    </style>
  </head>

  <body>
    <div class="container text-light">
      <form id="registration_form">
        <h1 class="text-center pt-4 head">STUDENT REGISTRATION FORM</h1>
        <div class="row">
          <div class="col-sm-6">
            <label class="text-center" >Full Name: </label>
            <input
              type="text" id="name"
              class="form-control"
              placeholder="Enter Your Name here"
            />
          </div>
          <div class="col-sm-6">
            <label class="text-center" >Email Address: </label>
            <input
              type="email" id="email"
              class="form-control"
              placeholder="Enter Your Email here"
            />
          </div>
          <div class="col-sm-6">
            <label class="text-center" >Phone Number: </label>
            <input
              type="text" id="phone"
              class="form-control"
              placeholder="Enter Your Phone number here"
            />
          </div>
        </div>
        <div class="row p-5">
          <div class="col-sm-6">
            <label class="text-center">Courses Interested in: </label> <br />
            <input type="checkbox" value="HTML" class="course"/>
            <label for="">HTML</label><br />
            <input type="checkbox" value="CSS" class="course" />
            <label for="">CSS</label>
            <br />
            <input type="checkbox"value="Javascript" class="course" />
            <label for="">Javascript</label>
            <br />
            <input type="checkbox"value="React" class="course" />
            <label for="">React</label>
            <br />
          </div>
          <div class="col-sm-6">
            <label class="text-center">Gender:</label> <br />
            <input type="radio" id="male" name="Gender" value="Male" />
            <label for="Male"> Male</label> <br />

            <input type="radio" id="female" name="Gender" value="Female" />
            <label for="Female"> Female</label> <br />

            <input type="radio" id="other" name="Gender" value="other" />
            <label for="Other"> Other</label> <br />
          </div>
          <div class="col-sm-12">
          <button type="submit" id="btn" class="form-control btn btn-warning">Submit</button>
          <button type="button" id="rst" class="form-control">Reset</button>
        </div>
        </div>
      </form>
    </div>
    <div class="container" id="ct">
      <h2 id="result"></h2>
    </div>
    <script>
      document.getElementById("rst").style.display = "none";
      document.getElementById("ct").style.display = "none";
      let btn = document.getElementById("btn");


    </script>
  </body>
</html>
