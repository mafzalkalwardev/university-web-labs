<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <title>Ayesha Login Form</title>
    <style>
        .container{
            border-radius: 8%;
            border: 4px solid black;
            box-shadow: inset rgb(146, 250, 114) 20px 20px 20px 20px;
            margin-top: 200px;
            padding: 10px 10px 10px 10px;
        }
        h2{
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">

        <h2> Registration Form</h2>
        <form onsubmit="return submitForm()" >
             <label for="" class="form-label">Full Name:</label>
            <input type="text" placeholder="Enter your full name here" class="form-control" id="name"> 
            <label for="" class="form-label">Email:</label>
            <input type="email" placeholder="Enter your Email here" class="form-control" id="email">
            <label for="" class="form-label"> Password: </label>
            <input type="password" placeholder="Enter your Passowrd here" class="form-control" id="pass"> <br>
            <button class="btn btn-primary w-100" onclick="submitForm()">submit</button> <br><br>
        </form>
    </div>

    <script>
        let name = document.getElementById("name").value;
        let email = document.getElementById("email").value;
        let pass = document.getElementById("pass").value;

        function submitForm(){
            if (name ==="" || email===""){
                alert("Kindly fill out all fields properly");
                return false;
            }if(pass.value.length<6){
                alert("Password should be minimum 6 characters");
                return false;
            }else{
                alert("Form Submitted Successfully")
                return true;
            }
        }

    </script>
</body>
</html>
